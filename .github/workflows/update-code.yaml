name: Deploy Lambda and Assets
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        default: nonprod
        type: environment
      zip_archive:
        description: 'Enter the name of the zip object from S3 to deploy. Example: master.zip'
        required: true
        default: master.zip
        type: string
      deploy_assets:
        description: 'Deploy assets to nonprod'
        required: true
        default: false
        type: boolean
      deploy_lambda:
        description: 'Deploy the Lambda to nonprod'
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate deployment selection
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment }}
          ZIP_ARCHIVE: ${{ inputs.zip_archive }}
          DEPLOY_ASSETS: ${{ inputs.deploy_assets }}
          DEPLOY_LAMBDA: ${{ inputs.deploy_lambda }}
        run: |
          if [[ "$SELECTED_ENVIRONMENT" != "nonprod" ]]; then
            echo "::error::This workflow only deploys to nonprod."
            exit 1
          fi
          if [[ "$DEPLOY_ASSETS" != "true" && "$DEPLOY_LAMBDA" != "true" ]]; then
            echo "::error::Select assets, Lambda, or both."
            exit 1
          fi
          if [[ ! "$ZIP_ARCHIVE" =~ ^[A-Za-z0-9._-]+\.zip$ ]] ||
             [[ "${ZIP_ARCHIVE%.zip}" == "." || "${ZIP_ARCHIVE%.zip}" == ".." ]]; then
            echo "::error::Enter a ZIP filename without a path."
            exit 1
          fi

  deploy-assets:
    needs: validate
    if: ${{ inputs.deploy_assets }}
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Test asset deployment
        run: node --test test/scripts/deploy-assets.test.cjs
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: GithubActionsSession
          aws-region: ${{ secrets.RSP_AWS_REGION }}
      - name: Deploy matching assets to nonprod
        env:
          ARTEFACTS_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          ZIP_ARCHIVE: ${{ inputs.zip_archive }}
        run: node scripts/deploy-assets.ts "$ARTEFACTS_BUCKET" "$ZIP_ARCHIVE"

  update-lambda-code:
    needs: [validate, deploy-assets]
    if: ${{ !cancelled() && needs.validate.result == 'success' && inputs.deploy_lambda && (!inputs.deploy_assets || needs.deploy-assets.result == 'success') }}
    uses: dvsa/.github/.github/workflows/update-lambda-function.yaml@v7
    with:
      environment: ${{ github.event.inputs.environment }}
      lambda-function-name: rsp-nonprod-apis-public-portal-serveExpressApp
      bucket-key: public-portal/serveExpressApp/${{ github.event.inputs.zip_archive }}
    permissions:
      id-token: write
    secrets:
      AWS_ROLE_TO_ASSUME_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
      AWS_ACCOUNT: ${{ secrets.RSP_AWS_ACCOUNT }}
      AWS_REGION: ${{ secrets.RSP_AWS_REGION }}
      BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

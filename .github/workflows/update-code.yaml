name: Run Lambda Function Update
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        default: nonprod
        type: environment
      zip_archive:
        description: 'Enter the name of the zip object from S3 to deploy. Example: master.zip'
        required: true
        default: master.zip
        type: string

jobs:
  update-lambda-code:
    uses: dvsa/.github/.github/workflows/update-lambda-function.yaml@v7
    with:
      environment: ${{ github.event.inputs.environment }}
      lambda-function-name: rsp-nonprod-apis-public-portal-serveExpressApp
      bucket-key: public-portal/serveExpressApp/${{ github.event.inputs.zip_archive }}
    permissions:
      id-token: write
    secrets:
      AWS_ROLE_TO_ASSUME_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
      AWS_ACCOUNT: ${{ secrets.RSP_AWS_ACCOUNT }}
      AWS_REGION: ${{ secrets.RSP_AWS_REGION }}
      BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

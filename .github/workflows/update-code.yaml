name: Run Lambda Function Update
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        default: nonprod
        type: environment
      zip_archive:
        description: 'Enter the name of the zip object from S3 to deploy. Example: master.zip'
        required: true
        default: master.zip
        type: string

jobs:
  deploy-assets:
    runs-on: ubuntu-latest
    environment: nonprod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restrict deployment to nonprod
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$SELECTED_ENVIRONMENT" != "nonprod" ]; then
            echo "::error::This workflow only deploys assets to nonprod."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Test asset deployment
        run: node --test test/scripts/deploy-assets.test.cjs
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: GithubActionsSession
          aws-region: ${{ secrets.RSP_AWS_REGION }}
      - name: Deploy matching assets to nonprod
        env:
          ARTEFACTS_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          ZIP_ARCHIVE: ${{ inputs.zip_archive }}
        run: node scripts/deploy-assets.ts "$ARTEFACTS_BUCKET" "$ZIP_ARCHIVE"

